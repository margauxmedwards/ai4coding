  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

=\"color:#8b949e;font-size:12px;flex-shrink:0;white-space:nowrap;\" style-hover=\"color:#e6edf3;\">success<\u002Fa>\n  <a href=\"#apa\" style=\"color:#8b949e;font-size:12px;flex-shrink:0;white-space:nowrap;\" style-hover=\"color:#e6edf3;\">ask · plan · act<\u002Fa>\n  <a href=\"#constrain\" style=\"color:#8b949e;font-size:12px;flex-shrink:0;white-space:nowrap;\" style-hover=\"color:#e6edf3;\">constrain<\u002Fa>\n  <a href=\"#example\" style=\"color:#8b949e;font-size:12px;flex-shrink:0;white-space:nowrap;\" style-hover=\"color:#e6edf3;\">before / after<\u002Fa>\n  <a href=\"#repo\" style=\"color:#8b949e;font-size:12px;flex-shrink:0;white-space:nowrap;\" style-hover=\"color:#e6edf3;\">repository<\u002Fa>\n  <a href=\"#agents\" style=\"color:#8b949e;font-size:12px;flex-shrink:0;white-space:nowrap;\" style-hover=\"color:#e6edf3;\">agent tools<\u002Fa>\n  <a href=\"#template\" style=\"color:#8b949e;font-size:12px;flex-shrink:0;white-space:nowrap;\" style-hover=\"color:#e6edf3;\">template<\u002Fa>\n  <a href=\"#takeaways\" style=\"color:#8b949e;font-size:12px;flex-shrink:0;white-space:nowrap;\" style-hover=\"color:#e6edf3;\">takeaways<\u002Fa>\n<\u002Fnav>\n\n<!-- ═══ HERO ═══ -->\n<section style=\"min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:100px 48px 80px;max-width:960px;margin:0 auto;\">\n  <p style=\"font-size:15px;color:#3fb950;margin-bottom:40px;display:flex;align-items:center;gap:6px;\">\n    <span>$<\u002Fspan>\n    <span style=\"display:inline-block;width:11px;height:20px;background:#3fb950;animation:blink 1s step-end infinite;vertical-align:middle;\"><\u002Fspan>\n  <\u002Fp>\n  <h1 style=\"font-size:clamp(44px,7.5vw,92px);font-weight:700;line-height:1.0;letter-spacing:-3px;margin-bottom:36px;\">\n    <span style=\"display:block;color:#e6edf3;\">HOW TO GET<\u002Fspan>\n    <span style=\"display:block;color:#e6edf3;\">THE MOST OUT<\u002Fspan>\n    <span style=\"display:block;color:#3fb950;\">OF YOUR TOKENS<\u002Fspan>\n  <\u002Fh1>\n  <p style=\"font-size:16px;color:#8b949e;max-width:520px;margin-bottom:16px;line-height:1.7;\">\n    Tips and tricks from setting up a robotics pipeline\n  <\u002Fp>\n  <p style=\"font-size:15px;color:#8b949e;max-width:520px;margin-bottom:72px;line-height:1.7;\">\n    Context-driven AI for any model.<br>Presentation built from Canva Slides -&gt; Text ChatGPT &amp; Claude -&gt; Website Design Claude Design<\u002Fp>\n  <div style=\"display:flex;align-items:center;gap:20px;border-top:1px solid #21262d;padding-top:28px;\">\n    <span style=\"color:#e6edf3;font-size:13px;\">Margaux Edwards<\u002Fspan>\n    <span style=\"color:#30363d;\">·<\u002Fspan>\n    <span style=\"color:#8b949e;font-size:13px;\">QUT Centre of Robotics - Mid Year Retreat<\u002Fspan>\n    <span style=\"color:#30363d;\">·<\u002Fspan>\n    <span style=\"color:#8b949e;font-size:13px;\">June 2026<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"color:#30363d;font-size:12px;margin-top:80px;letter-spacing:2px;\">scroll ↓<\u002Fp>\n<\u002Fsection>\n\n<!-- ═══ [01] THE PROBLEM ═══ -->\n<section id=\"problem\" style=\"background:#161b22;padding:100px 48px;\">\n  <div style=\"max-width:920px;margin:0 auto;\">\n    <p style=\"color:#3fb950;font-size:11px;letter-spacing:3px;margin-bottom:20px;font-weight:600;\">[01]<\u002Fp>\n    <h2 style=\"font-size:clamp(26px,4vw,52px);font-weight:700;letter-spacing:-1.5px;margin-bottom:16px;line-height:1.15;\">Can you deploy this<br>on the HPC for me?<\u002Fh2>\n    <p style=\"color:#8b949e;font-size:15px;max-width:580px;margin-bottom:48px;line-height:1.7;\">A single prompt sounds simple. But the useful answer depends on context.<\u002Fp>\n\n    <!-- What does the model need? -->\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:48px;\">\n      <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:28px;\">\n        <p style=\"color:#ff7b72;font-size:12px;letter-spacing:2px;margin-bottom:16px;font-weight:600;\">WHAT WAS ASKED<\u002Fp>\n        <div style=\"background:#161b22;border:1px solid #30363d;border-radius:6px;padding:16px;\">\n          <pre style=\"font-size:13px;color:#e6edf3;line-height:1.7;\">Can you deploy this on the HPC for me?<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:28px;\">\n        <p style=\"color:#3fb950;font-size:12px;letter-spacing:2px;margin-bottom:16px;font-weight:600;\">WHAT THE MODEL NEEDS<\u002Fp>\n        <ul style=\"list-style:none;display:flex;flex-direction:column;gap:8px;\">\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;align-items:baseline;gap:10px;\"><span style=\"color:#3fb950;flex-shrink:0;\">→<\u002Fspan> where the data lives<\u002Fli>\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;align-items:baseline;gap:10px;\"><span style=\"color:#3fb950;flex-shrink:0;\">→<\u002Fspan> how the cluster schedules jobs<\u002Fli>\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;align-items:baseline;gap:10px;\"><span style=\"color:#3fb950;flex-shrink:0;\">→<\u002Fspan> what commands already work<\u002Fli>\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;align-items:baseline;gap:10px;\"><span style=\"color:#3fb950;flex-shrink:0;\">→<\u002Fspan> what failure looks like<\u002Fli>\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;align-items:baseline;gap:10px;\"><span style=\"color:#3fb950;flex-shrink:0;\">→<\u002Fspan> what success means<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Terminal window -->\n    <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:10px;overflow:hidden;\">\n      <div style=\"background:#21262d;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30363d;\">\n        <span style=\"color:#8b949e;font-size:12px;\">user@aqua:~<\u002Fspan>\n        <span style=\"color:#8b949e;font-size:12px;\">bash<\u002Fspan>\n        <span style=\"color:#6e7681;font-size:13px;\">×<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:28px;\">\n        <pre style=\"font-size:13px;line-height:1.8;\"><span style=\"color: rgb(63, 185, 80);\">user@aqua:~$<\u002Fspan> <span style=\"color: rgb(230, 237, 243);\">write a PBS job to convert a rosbag\n<\u002Fspan><span style=\"color: rgb(139, 148, 158);\"># model response ─────────────────────────────────────<\u002Fspan><span style=\"color: rgb(230, 237, 243);\">\n#!/bin/bash\n<\u002Fspan><span style=\"color: rgb(255, 123, 114);\">#SBATCH --job-name=convert<\u002Fspan>                    <span style=\"color: rgb(240, 136, 62);\"># ✗ SLURM — you're on PBS<\u002Fspan><span style=\"color: rgb(255, 123, 114);\">\n#SBATCH --ntasks=1<\u002Fspan><span style=\"color: rgb(255, 123, 114);\">#SBATCH --mem=8G<\u002Fspan>            <span style=\"color: rgb(240, 136, 62);\"># ✗ no queue, walltime, or select\n<\u002Fspan><span style=\"color: rgb(255, 123, 114);\">python convert_rosbag.py input.bag output/    <\u002Fspan><span style=\"color: rgb(240, 136, 62);\"># ✗ no pixi  \n                                              # ✗ no scratch staging  \n                                              # ✗ hardcoded paths<\u002Fspan><\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"color:#8b949e;font-size:13px;margin-top:24px;max-width:620px;line-height:1.75;\">The model defaulted to SLURM — more common in training data. Your cluster runs PBS. It didn't know, because nothing in context told it.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ [02] PROMPTING VS CONTEXT ═══ -->\n<section id=\"pvsc\" style=\"padding:100px 48px;background:#0d1117;\">\n  <div style=\"max-width:920px;margin:0 auto;\">\n    <p style=\"color:#3fb950;font-size:11px;letter-spacing:3px;margin-bottom:20px;font-weight:600;\">[02]<\u002Fp>\n    <h2 style=\"font-size:clamp(26px,4vw,52px);font-weight:700;letter-spacing:-1.5px;margin-bottom:20px;line-height:1.15;\">Prompting vs context<\u002Fh2>\n    <p style=\"color:#8b949e;font-size:15px;max-width:560px;margin-bottom:48px;line-height:1.7;\">Prompting is what you type. Context is what the model already knows when you type it.<\u002Fp>\n\n    <div style=\"border:1px solid #30363d;border-radius:10px;overflow:hidden;margin-bottom:40px;\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;\">\n        <div style=\"background:#21262d;padding:16px 28px;border-bottom:1px solid #30363d;\">\n          <span style=\"color:#ff7b72;font-size:12px;font-weight:700;letter-spacing:2px;\">PROMPTING<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#21262d;padding:16px 28px;border-left:1px solid #30363d;border-bottom:1px solid #30363d;\">\n          <span style=\"color:#3fb950;font-size:12px;font-weight:700;letter-spacing:2px;\">CONTEXT<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#161b22;padding:14px 28px;border-bottom:1px solid #21262d;\"><span style=\"color:#8b949e;font-size:13px;\">Single command<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#161b22;padding:14px 28px;border-left:1px solid #30363d;border-bottom:1px solid #21262d;\"><span style=\"color:#e6edf3;font-size:13px;\">System state<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#161b22;padding:14px 28px;border-bottom:1px solid #21262d;\"><span style=\"color:#8b949e;font-size:13px;\">Fast interaction<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#161b22;padding:14px 28px;border-left:1px solid #30363d;border-bottom:1px solid #21262d;\"><span style=\"color:#e6edf3;font-size:13px;\">Persistent knowledge<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#161b22;padding:14px 28px;border-bottom:1px solid #21262d;\"><span style=\"color:#8b949e;font-size:13px;\">Narrow scope<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#161b22;padding:14px 28px;border-left:1px solid #30363d;border-bottom:1px solid #21262d;\"><span style=\"color:#e6edf3;font-size:13px;\">Constraints + tooling<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#161b22;padding:14px 28px;\"><span style=\"color:#8b949e;font-size:13px;\">Local task<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#161b22;padding:14px 28px;border-left:1px solid #30363d;\"><span style=\"color:#e6edf3;font-size:13px;\">Pipeline awareness<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <blockquote style=\"border-left:3px solid #58a6ff;padding:20px 24px;background:#161b22;border-radius:0 8px 8px 0;max-width:620px;\">\n      <p style=\"color:#58a6ff;font-size:16px;line-height:1.65;font-style:italic;\">Tokens are more useful when they carry project state, not just instructions.<\u002Fp>\n    <\u002Fblockquote>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ [03] BE SPECIFIC ABOUT SUCCESS ═══ -->\n<section id=\"success\" style=\"background:#161b22;padding:100px 48px;\">\n  <div style=\"max-width:920px;margin:0 auto;\">\n    <p style=\"color:#3fb950;font-size:11px;letter-spacing:3px;margin-bottom:20px;font-weight:600;\">[03]<\u002Fp>\n    <h2 style=\"font-size:clamp(26px,4vw,52px);font-weight:700;letter-spacing:-1.5px;margin-bottom:20px;line-height:1.15;\">Be specific about success<\u002Fh2>\n    <p style=\"color:#8b949e;font-size:15px;max-width:580px;margin-bottom:48px;line-height:1.7;\">Vague goals produce vague results. Define success before the model starts.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px;\">\n      <!-- Bad -->\n      <div>\n        <p style=\"color:#ff7b72;font-size:12px;font-weight:700;letter-spacing:1.5px;margin-bottom:12px;\">BAD<\u002Fp>\n        <div style=\"background:#0d1117;border:1px solid #ff7b72;border-radius:10px;padding:24px;\">\n          <pre style=\"font-size:13px;color:#8b949e;line-height:1.7;\">Can you fix this?<\u002Fpre>\n        <\u002Fdiv>\n        <p style=\"color:#8b949e;font-size:12px;margin-top:10px;line-height:1.6;\">No target. No scope. No way to know when you're done.<\u002Fp>\n      <\u002Fdiv>\n      <!-- Better -->\n      <div>\n        <p style=\"color:#3fb950;font-size:12px;font-weight:700;letter-spacing:1.5px;margin-bottom:12px;\">BETTER<\u002Fp>\n        <div style=\"background:#0d1117;border:1px solid #3fb950;border-radius:10px;padding:24px;\">\n          <pre style=\"font-size:13px;color:#e6edf3;line-height:1.7;\">Make `pixi run convert-rosbag` work on Aqua.<\u002Fpre>\n        <\u002Fdiv>\n        <p style=\"color:#8b949e;font-size:12px;margin-top:10px;line-height:1.6;\">Specific command, specific environment.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Define success box -->\n    <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:10px;overflow:hidden;\">\n      <div style=\"background:#21262d;padding:12px 24px;border-bottom:1px solid #30363d;\">\n        <span style=\"color:#3fb950;font-size:12px;font-weight:700;letter-spacing:1.5px;\">DEFINE SUCCESS<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:28px;\">\n        <pre style=\"font-size:13px;color:#e6edf3;line-height:1.9;\"><span style=\"color:#8b949e;\">Success means:<\u002Fspan>\n<span style=\"color:#3fb950;\">\n1.<\u002Fspan> PBS job submits cleanly.\n<span style=\"color:#3fb950;\">2.<\u002Fspan> Logs are written under <span style=\"color:#a5d6ff;\">logs/convert-rosbag/<\u002Fspan>.\n<span style=\"color:#3fb950;\">3.<\u002Fspan> Output frames appear under <span style=\"color:#a5d6ff;\">datasets/data/bags/<\u002Fspan>.\n<span style=\"color:#3fb950;\">4.<\u002Fspan> Do not run the full dataset locally.<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ [04] ASK | PLAN | ACT ═══ -->\n<section id=\"apa\" style=\"padding:100px 48px;background:#0d1117;\">\n  <div style=\"max-width:920px;margin:0 auto;\">\n    <p style=\"color:#3fb950;font-size:11px;letter-spacing:3px;margin-bottom:20px;font-weight:600;\">[04]<\u002Fp>\n    <h2 style=\"font-size:clamp(26px,4vw,52px);font-weight:700;letter-spacing:-1.5px;margin-bottom:20px;line-height:1.15;\">Ask · Plan · Act<\u002Fh2>\n    <p style=\"color:#8b949e;font-size:15px;max-width:560px;margin-bottom:48px;line-height:1.7;\">Match the mode to the task. Don't act until you've asked and planned.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px;\">\n      <!-- Ask -->\n      <div style=\"background:#161b22;border:1px solid #30363d;border-radius:10px;padding:28px;\">\n        <p style=\"color:#58a6ff;font-size:22px;font-weight:700;margin-bottom:16px;letter-spacing:-0.5px;\">Ask<\u002Fp>\n        <p style=\"color:#8b949e;font-size:12px;margin-bottom:16px;line-height:1.6;\">Use when you want:<\u002Fp>\n        <ul style=\"list-style:none;display:flex;flex-direction:column;gap:8px;\">\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;gap:8px;\"><span style=\"color:#58a6ff;flex-shrink:0;\">·<\u002Fspan>options<\u002Fli>\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;gap:8px;\"><span style=\"color:#58a6ff;flex-shrink:0;\">·<\u002Fspan>tradeoffs<\u002Fli>\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;gap:8px;\"><span style=\"color:#58a6ff;flex-shrink:0;\">·<\u002Fspan>unknowns surfaced<\u002Fli>\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;gap:8px;\"><span style=\"color:#58a6ff;flex-shrink:0;\">·<\u002Fspan>risks identified<\u002Fli>\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;gap:8px;\"><span style=\"color:#58a6ff;flex-shrink:0;\">·<\u002Fspan>a decision before edits<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <!-- Plan -->\n      <div style=\"background:#161b22;border:1px solid #30363d;border-radius:10px;padding:28px;\">\n        <p style=\"color:#ffa657;font-size:22px;font-weight:700;margin-bottom:16px;letter-spacing:-0.5px;\">Plan<\u002Fp>\n        <p style=\"color:#8b949e;font-size:12px;margin-bottom:16px;line-height:1.6;\">Use when you want the agent to:<\u002Fp>\n        <ul style=\"list-style:none;display:flex;flex-direction:column;gap:8px;\">\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;gap:8px;\"><span style=\"color:#ffa657;flex-shrink:0;\">·<\u002Fspan>inspect files<\u002Fli>\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;gap:8px;\"><span style=\"color:#ffa657;flex-shrink:0;\">·<\u002Fspan>propose changes<\u002Fli>\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;gap:8px;\"><span style=\"color:#ffa657;flex-shrink:0;\">·<\u002Fspan>define success<\u002Fli>\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;gap:8px;\"><span style=\"color:#ffa657;flex-shrink:0;\">·<\u002Fspan>identify verification steps<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <!-- Act -->\n      <div style=\"background:#161b22;border:1px solid #30363d;border-radius:10px;padding:28px;\">\n        <p style=\"color:#3fb950;font-size:22px;font-weight:700;margin-bottom:16px;letter-spacing:-0.5px;\">Act<\u002Fp>\n        <p style=\"color:#8b949e;font-size:12px;margin-bottom:16px;line-height:1.6;\">Use when you want the agent to:<\u002Fp>\n        <ul style=\"list-style:none;display:flex;flex-direction:column;gap:8px;\">\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;gap:8px;\"><span style=\"color:#3fb950;flex-shrink:0;\">·<\u002Fspan>edit files<\u002Fli>\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;gap:8px;\"><span style=\"color:#3fb950;flex-shrink:0;\">·<\u002Fspan>run commands<\u002Fli>\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;gap:8px;\"><span style=\"color:#3fb950;flex-shrink:0;\">·<\u002Fspan>verify results<\u002Fli>\n          <li style=\"color:#e6edf3;font-size:13px;display:flex;gap:8px;\"><span style=\"color:#3fb950;flex-shrink:0;\">·<\u002Fspan>report what changed<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <blockquote style=\"border-left:3px solid #3fb950;padding:20px 24px;background:#161b22;border-radius:0 8px 8px 0;max-width:620px;\">\n      <p style=\"color:#e6edf3;font-size:15px;line-height:1.7;\">The plan from <span style=\"color:#58a6ff;\">Ask/Plan<\u002Fspan> becomes context for <span style=\"color:#3fb950;\">Act<\u002Fspan> — and the outcome seeds the next loop.<\u002Fp>\n    <\u002Fblockquote>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ [05] CONSTRAIN + MODEL ═══ -->\n<section id=\"constrain\" style=\"background:#161b22;padding:100px 48px;\">\n  <div style=\"max-width:920px;margin:0 auto;\">\n    <p style=\"color:#3fb950;font-size:11px;letter-spacing:3px;margin-bottom:20px;font-weight:600;\">[05]<\u002Fp>\n    <h2 style=\"font-size:clamp(26px,4vw,52px);font-weight:700;letter-spacing:-1.5px;margin-bottom:20px;line-height:1.15;\">Constrain + model<\u002Fh2>\n    <p style=\"color:#8b949e;font-size:15px;max-width:560px;margin-bottom:56px;line-height:1.7;\">Two rules that work together to reduce wasted tokens.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-bottom:48px;\">\n      <!-- Constrain output format -->\n      <div>\n        <p style=\"color:#f0883e;font-size:12px;letter-spacing:2px;margin-bottom:16px;font-weight:600;\">RULE 1<\u002Fp>\n        <h3 style=\"font-size:18px;font-weight:600;color:#e6edf3;margin-bottom:12px;line-height:1.3;\">Constrain the output format before you constrain the content<\u002Fh3>\n        <p style=\"color:#8b949e;font-size:13px;line-height:1.7;margin-bottom:20px;\">Tell the model <em style=\"color:#e6edf3;\">what kind<\u002Fem> of answer you want before what to answer.<\u002Fp>\n        <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:20px;\">\n          <pre style=\"font-size:12px;color:#8b949e;line-height:1.9;\"><span style=\"color:#e6edf3;\">Output:<\u002Fspan>\n  <span style=\"color:#3fb950;\">·<\u002Fspan> patch\n  <span style=\"color:#3fb950;\">·<\u002Fspan> checklist\n  <span style=\"color:#3fb950;\">·<\u002Fspan> command\n  <span style=\"color:#3fb950;\">·<\u002Fspan> table\n  <span style=\"color:#3fb950;\">·<\u002Fspan> PR description<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- Right model -->\n      <div>\n        <p style=\"color:#a371f7;font-size:12px;letter-spacing:2px;margin-bottom:16px;font-weight:600;\">RULE 2<\u002Fp>\n        <h3 style=\"font-size:18px;font-weight:600;color:#e6edf3;margin-bottom:12px;line-height:1.3;\">The cheapest model that reliably does the job is the right model<\u002Fh3>\n        <p style=\"color:#8b949e;font-size:13px;line-height:1.7;margin-bottom:20px;\">Better context lets smaller models do more. Context reduces variance.<\u002Fp>\n        <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:8px;overflow:hidden;\">\n          <table style=\"font-size:12px;\">\n            <thead>\n              <tr style=\"background:#21262d;border-bottom:1px solid #30363d;\">\n                <th style=\"padding:10px 16px;text-align:left;color:#8b949e;font-weight:600;\">Task<\u002Fth>\n                <th style=\"padding:10px 16px;text-align:left;color:#8b949e;font-weight:600;border-left:1px solid #30363d;\">Usually needs<\u002Fth>\n              <\u002Ftr>\n            <\u002Fthead>\n            <tbody>\n              <tr style=\"border-bottom:1px solid #21262d;\">\n                <td style=\"padding:10px 16px;color:#8b949e;\">Rename files, format text<\u002Ftd>\n                <td style=\"padding:10px 16px;color:#e6edf3;border-left:1px solid #30363d;\">Fast / small model<\u002Ftd>\n              <\u002Ftr>\n              <tr style=\"border-bottom:1px solid #21262d;\">\n                <td style=\"padding:10px 16px;color:#8b949e;\">Debug stack traces<\u002Ftd>\n                <td style=\"padding:10px 16px;color:#e6edf3;border-left:1px solid #30363d;\">Reasoning + repo context<\u002Ftd>\n              <\u002Ftr>\n              <tr style=\"border-bottom:1px solid #21262d;\">\n                <td style=\"padding:10px 16px;color:#8b949e;\">Refactor across packages<\u002Ftd>\n                <td style=\"padding:10px 16px;color:#e6edf3;border-left:1px solid #30363d;\">Planning + tests<\u002Ftd>\n              <\u002Ftr>\n              <tr>\n                <td style=\"padding:10px 16px;color:#8b949e;\">HPC deployment<\u002Ftd>\n                <td style=\"padding:10px 16px;color:#e6edf3;border-left:1px solid #30363d;\">System knowledge + constraints<\u002Ftd>\n              <\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ [06] BEFORE / AFTER ═══ -->\n<section id=\"example\" style=\"padding:100px 48px;background:#0d1117;\">\n  <div style=\"max-width:920px;margin:0 auto;\">\n    <p style=\"color:#3fb950;font-size:11px;letter-spacing:3px;margin-bottom:20px;font-weight:600;\">[06]<\u002Fp>\n    <h2 style=\"font-size:clamp(26px,4vw,52px);font-weight:700;letter-spacing:-1.5px;margin-bottom:20px;line-height:1.15;\">The same task.<\u002Fh2>\n    <p style=\"color:#8b949e;font-size:15px;max-width:640px;margin-bottom:56px;line-height:1.7;\">\n      <span style=\"color:#e6edf3;\">Prompt:<\u002Fspan> \"write a PBS job to convert a rosbag\" — same words, two different context loads.\n    <\u002Fp>\n\n    <!-- WITHOUT CONTEXT — full width, matching WITH CONTEXT style -->\n    <div style=\"margin-bottom:16px;\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px;\">\n        <span style=\"width:8px;height:8px;border-radius:50%;background:#ff7b72;display:inline-block;\"><\u002Fspan>\n        <span style=\"color:#ff7b72;font-size:12px;font-weight:700;letter-spacing:1.5px;\">WITHOUT CONTEXT<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#0d1117;border:1px solid #ff7b72;border-radius:10px;overflow:hidden;\">\n        <div style=\"background:#21262d;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30363d;\">\n          <span style=\"color:#8b949e;font-size:12px;\">user@aqua:~/project<\u002Fspan>\n          <span style=\"color:#8b949e;font-size:12px;\">cat jobs/convert_rosbag.sh<\u002Fspan>\n          <span style=\"color:#6e7681;font-size:13px;\">×<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:28px 32px;overflow-x:auto;\">\n          <pre style=\"font-size:13px;line-height:2.0;white-space:pre;\"><span style=\"color:#e6edf3;\">#!/bin/bash<\u002Fspan>\n<span style=\"color:#ff7b72;\">#SBATCH --job-name=convert<\u002Fspan>\n<span style=\"color:#ff7b72;\">#SBATCH --ntasks=1<\u002Fspan>\n<span style=\"color:#ff7b72;\">#SBATCH --mem=8G<\u002Fspan>\n\n<span style=\"color:#ff7b72;\">python convert_rosbag.py input.bag output/<\u002Fspan><\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"list-style:none;margin-top:14px;display:flex;flex-wrap:wrap;gap:10px 32px;\">\n        <li style=\"color:#ff7b72;font-size:12px;\">✗ SLURM on a PBS cluster<\u002Fli>\n        <li style=\"color:#ff7b72;font-size:12px;\">✗ no pixi environment<\u002Fli>\n        <li style=\"color:#ff7b72;font-size:12px;\">✗ hardcoded paths<\u002Fli>\n        <li style=\"color:#ff7b72;font-size:12px;\">✗ no scratch staging<\u002Fli>\n        <li style=\"color:#ff7b72;font-size:12px;\">✗ no log capture<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <!-- WITH CONTEXT — full width, cat-file style -->\n    <div style=\"margin-bottom:40px;\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px;\">\n        <span style=\"width:8px;height:8px;border-radius:50%;background:#3fb950;display:inline-block;\"><\u002Fspan>\n        <span style=\"color:#3fb950;font-size:12px;font-weight:700;letter-spacing:1.5px;\">WITH CONTEXT<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#0d1117;border:1px solid #3fb950;border-radius:10px;overflow:hidden;\">\n        <div style=\"background:#21262d;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30363d;\">\n          <span style=\"color:#8b949e;font-size:12px;\">user@aqua:~/project<\u002Fspan>\n          <span style=\"color:#8b949e;font-size:12px;\">cat jobs/convert_rosbag.pbs<\u002Fspan>\n          <span style=\"color:#6e7681;font-size:13px;\">×<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:28px 32px;overflow-x:auto;\">\n          <pre style=\"font-size:13px;line-height:2.0;white-space:pre;\"><span style=\"color:#e6edf3;\">#!/bin/bash<\u002Fspan>\n<span style=\"color:#3fb950;\">#PBS -N rosbag_convert<\u002Fspan>\n<span style=\"color:#3fb950;\">#PBS -l select=1:ncpus=4:mem=16gb<\u002Fspan>\n<span style=\"color:#3fb950;\">#PBS -l walltime=12:00:00<\u002Fspan>\n<span style=\"color:#3fb950;\">#PBS -q cpu_batch<\u002Fspan>\n\n<span style=\"color:#e6edf3;\">set -euo pipefail<\u002Fspan>\n<span style=\"color:#e6edf3;\">cd \"${PBS_O_WORKDIR}\"<\u002Fspan>\n<span style=\"color:#e6edf3;\">mkdir -p logs<\u002Fspan>\n\n<span style=\"color:#6e7681;\"># per-job log files<\u002Fspan>\n<span style=\"color:#e6edf3;\">JOB_ID=\"${PBS_JOBID%%.*}\"<\u002Fspan>\n<span style=\"color:#e6edf3;\">exec &gt;\"logs/convert_${JOB_ID}.out\" \\<\u002Fspan>\n<span style=\"color:#e6edf3;\">     2&gt;\"logs/convert_${JOB_ID}.err\"<\u002Fspan>\n\n<span style=\"color:#6e7681;\"># stage input to scratch for fast I/O<\u002Fspan>\n<span style=\"color:#e6edf3;\">SCRATCH=\"${PBS_TMPDIR}/cvt_${JOB_ID}\"<\u002Fspan>\n<span style=\"color:#e6edf3;\">mkdir -p \"${SCRATCH}\"<\u002Fspan>\n<span style=\"color:#e6edf3;\">trap 'rm -rf \"${SCRATCH}\"' EXIT<\u002Fspan>\n<span style=\"color:#e6edf3;\">rsync -ahP \"${INPUT_BAG}\" \"${SCRATCH}/\"<\u002Fspan>\n\n<span style=\"color:#6e7681;\"># convert<\u002Fspan>\n<span style=\"color:#e6edf3;\">pixi run bag-convert \\<\u002Fspan>\n<span style=\"color:#e6edf3;\">    --input  \"${SCRATCH}/$(basename ${INPUT_BAG})\" \\<\u002Fspan>\n<span style=\"color:#e6edf3;\">    --output \"${SCRATCH}/output\"<\u002Fspan>\n\n<span style=\"color:#6e7681;\"># copy results back<\u002Fspan>\n<span style=\"color:#e6edf3;\">rsync -ahP \"${SCRATCH}/output/\" \"${OUTPUT_DIR}/\"<\u002Fspan><\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"list-style:none;margin-top:14px;display:flex;flex-wrap:wrap;gap:x 32px;gap:10px 32px;\">\n        <li style=\"color:#3fb950;font-size:12px;\">✓ correct PBS directives + queue<\u002Fli>\n        <li style=\"color:#3fb950;font-size:12px;\">✓ pixi run for reproducible env<\u002Fli>\n        <li style=\"color:#3fb950;font-size:12px;\">✓ configurable paths via env vars<\u002Fli>\n        <li style=\"color:#3fb950;font-size:12px;\">✓ scratch staging + cleanup trap<\u002Fli>\n        <li style=\"color:#3fb950;font-size:12px;\">✓ predictable per-job log files<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <!-- Real world screenshot -->\n    <div style=\"margin-bottom:24px;\">\n      <p style=\"color:#8b949e;font-size:11px;letter-spacing:3px;margin-bottom:16px;font-weight:600;\">THIS ACTUALLY HAPPENED<\u002Fp>\n      <div style=\"border:1px solid #30363d;border-radius:10px;overflow:hidden;\">\n        <div style=\"background:#21262d;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30363d;\">\n          <span style=\"color:#8b949e;font-size:12px;\">user@aqua:~/project<\u002Fspan>\n          <span style=\"color:#8b949e;font-size:12px;\">Copilot — Can you deploy this on the HPC for me?<\u002Fspan>\n          <span style=\"color:#6e7681;font-size:13px;\">×<\u002Fspan>\n        <\u002Fdiv>\n        <img src=\"c18f5cd4-047d-4420-9c02-c111e38f238a\" alt=\"Copilot session showing the model reading pbs-jobs skill and Aqua documentation\" style=\"display:block;width:100%;height:auto;\">\n      <\u002Fdiv>\n      <p style=\"color:#8b949e;font-size:12px;margin-top:12px;line-height:1.65;max-width:760px;\">The model read the job file, loaded the <code style=\"color:#e6edf3;background:#21262d;padding:2px 6px;border-radius:4px;\">pbs-jobs<\u002Fcode> skill, and fetched the Aqua docs — then reasoned through the correct PBS syntax, scratch paths, and log conventions without being told explicitly.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- What made the difference -->\n    <div style=\"border:1px solid #30363d;border-radius:10px;padding:32px;background:#161b22;\">\n      <p style=\"color:#58a6ff;font-size:11px;letter-spacing:3px;margin-bottom:24px;font-weight:600;\">WHAT MADE THE DIFFERENCE<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px;\">\n        <div>\n          <p style=\"color:#e6edf3;font-size:13px;font-weight:600;margin-bottom:10px;\">copilot-instructions.md<\u002Fp>\n          <ul style=\"list-style:none;display:flex;flex-direction:column;gap:6px;\">\n            <li style=\"color:#8b949e;font-size:12px;line-height:1.6;\">\"PBS is the scheduler on Aqua, not SLURM\"<\u002Fli>\n            <li style=\"color:#8b949e;font-size:12px;line-height:1.6;\">\"use pixi run for all commands\"<\u002Fli>\n            <li style=\"color:#8b949e;font-size:12px;line-height:1.6;\">\"prefer reproducible log paths per job\"<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"border-left:1px solid #30363d;padding-left:28px;\">\n          <p style=\"color:#e6edf3;font-size:13px;font-weight:600;margin-bottom:10px;\">hpc-core + pbs-jobs / SKILL.md<\u002Fp>\n          <ul style=\"list-style:none;display:flex;flex-direction:column;gap:6px;\">\n            <li style=\"color:#8b949e;font-size:12px;line-height:1.6;\">exact PBS directive syntax + select format<\u002Fli>\n            <li style=\"color:#8b949e;font-size:12px;line-height:1.6;\">JOB_ID_SHORT pattern for log naming<\u002Fli>\n            <li style=\"color:#8b949e;font-size:12px;line-height:1.6;\">PBS_TMPDIR for fast scratch I/O<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ [07] THE REPOSITORY ═══ -->\n<section id=\"repo\" style=\"background:#161b22;padding:100px 48px;\">\n  <div style=\"max-width:920px;margin:0 auto;\">\n    <p style=\"color:#3fb950;font-size:11px;letter-spacing:3px;margin-bottom:20px;font-weight:600;\">[07]<\u002Fp>\n    <h2 style=\"font-size:clamp(26px,4vw,52px);font-weight:700;letter-spacing:-1.5px;margin-bottom:20px;line-height:1.15;\">The repository is<br>the prompt scaffold<\u002Fh2>\n    <p style=\"color:#8b949e;font-size:15px;max-width:580px;margin-bottom:48px;line-height:1.7;\">A repo can carry context that chat history forgets. Each file removes ambiguity.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:32px;\">\n      <!-- File tree -->\n      <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:28px;overflow-x:auto;\">\n        <pre style=\"font-size:12px;line-height:2.0;\"><span style=\"color:#e6edf3;font-weight:600;\">.<\u002Fspan>\n├── <span style=\"color:#e6edf3;\">README.md<\u002Fspan>\n├── <span style=\"color:#3fb950;font-weight:600;\">AGENTS.md<\u002Fspan>\n├── <span style=\"color:#e6edf3;\">pixi.toml<\u002Fspan>\n├── <span style=\"color:#58a6ff;\">scripts/<\u002Fspan>\n├── <span style=\"color:#58a6ff;\">slides/<\u002Fspan>\n└── <span style=\"color:#58a6ff;\">.github/<\u002Fspan>\n    ├── <span style=\"color:#3fb950;\">copilot-instructions.md<\u002Fspan>\n    ├── <span style=\"color:#58a6ff;\">instructions/<\u002Fspan>\n    ├── <span style=\"color:#58a6ff;\">skills/<\u002Fspan>\n    └── <span style=\"color:#58a6ff;\">workflows/deploy.yml<\u002Fspan><\u002Fpre>\n      <\u002Fdiv>\n\n      <!-- For humans vs agents -->\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:22px;\">\n          <p style=\"color:#58a6ff;font-size:12px;letter-spacing:1.5px;font-weight:600;margin-bottom:12px;\">FOR HUMANS<\u002Fp>\n          <ul style=\"list-style:none;display:flex;flex-direction:column;gap:7px;\">\n            <li style=\"color:#8b949e;font-size:13px;\">README with the first command to run<\u002Fli>\n            <li style=\"color:#8b949e;font-size:13px;\">diagrams, links, data locations<\u002Fli>\n            <li style=\"color:#8b949e;font-size:13px;\">expected outputs<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:22px;\">\n          <p style=\"color:#3fb950;font-size:12px;letter-spacing:1.5px;font-weight:600;margin-bottom:12px;\">FOR AGENTS<\u002Fp>\n          <ul style=\"list-style:none;display:flex;flex-direction:column;gap:7px;\">\n            <li style=\"color:#e6edf3;font-size:13px;\">AGENTS.md<\u002Fli>\n            <li style=\"color:#8b949e;font-size:13px;\">examples of good commands<\u002Fli>\n            <li style=\"color:#8b949e;font-size:13px;\">constraints<\u002Fli>\n            <li style=\"color:#8b949e;font-size:13px;\">verification checklist<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Useful constraints + case study -->\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;\">\n      <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:10px;overflow:hidden;\">\n        <div style=\"background:#21262d;padding:12px 20px;border-bottom:1px solid #30363d;\">\n          <span style=\"color:#f0883e;font-size:12px;font-weight:700;letter-spacing:1.5px;\">USEFUL CONSTRAINTS<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:20px;\">\n          <pre style=\"font-size:12px;color:#8b949e;line-height:1.9;\">Never run full data locally.\nAvoid destructive commands.\nPrefer small test subsets.\nWrite logs to expected directory.\nReport commands that were run.<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:10px;overflow:hidden;\">\n        <div style=\"background:#21262d;padding:12px 20px;border-bottom:1px solid #30363d;\">\n          <span style=\"color:#a371f7;font-size:12px;font-weight:700;letter-spacing:1.5px;\">CASE STUDY: AQUA HPC<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:20px;\">\n          <pre style=\"font-size:12px;color:#e6edf3;line-height:1.9;\"><span style=\"color:#8b949e;\">Local path:<\u002Fspan>  /mnt/aqua_home/datasets/nsavp_data/\n<span style=\"color:#8b949e;\">Aqua path:<\u002Fspan>   ~/datasets/nsavp_data/\n<span style=\"color:#8b949e;\">Scheduler:<\u002Fspan>   PBS\n<span style=\"color:#8b949e;\">Queue:<\u002Fspan>       gpu_batch\n\n<span style=\"color:#8b949e;\">Success:<\u002Fspan>\n  job id returned\n  logs produced\n  output files created<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"color:#58a6ff;font-size:13px;margin-top:32px;line-height:1.7;border-left:3px solid #58a6ff;padding-left:16px;max-width:560px;\">The important context is specific, operational, easy to verify, and close to the code — written down <em style=\"color:#e6edf3;\">before<\u002Fem> the task starts.<\u002Fp>\n\n    <!-- This talk is executable -->\n    \n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ [08] AGENT CUSTOMISATIONS ═══ -->\n<section id=\"agents\" style=\"padding:100px 48px;background:#0d1117;\">\n  <div style=\"max-width:920px;margin:0 auto;\">\n    <p style=\"color:#3fb950;font-size:11px;letter-spacing:3px;margin-bottom:20px;font-weight:600;\">[08]<\u002Fp>\n    <h2 style=\"font-size:clamp(26px,4vw,52px);font-weight:700;letter-spacing:-1.5px;margin-bottom:20px;line-height:1.15;\">Agent customisations<\u002Fh2>\n    <p style=\"color:#8b949e;font-size:15px;max-width:560px;margin-bottom:48px;line-height:1.7;\">Codify repeated advice. Don't rely on memory — put the convention in the repo.<\u002Fp>\n\n    <!-- Screenshot -->\n    <div style=\"border:1px solid #30363d;border-radius:10px;overflow:hidden;margin-bottom:40px;\">\n      <div style=\"background:#21262d;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30363d;\">\n        <span style=\"color:#8b949e;font-size:12px;\">Copilot CLI<\u002Fspan>\n        <span style=\"color:#8b949e;font-size:12px;\">Agent Customizations<\u002Fspan>\n        <span style=\"color:#6e7681;font-size:13px;\">×<\u002Fspan>\n      <\u002Fdiv>\n      <img src=\"73e513c3-38c1-413c-8c0c-872e4f237d8b\" alt=\"Agent Customizations panel showing Agents, Skills, Instructions, Hooks, MCP Servers and Plugins\" style=\"display:block;width:100%;height:auto;\">\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:32px;\">\n      <div style=\"background:#161b22;border:1px solid #30363d;border-radius:10px;padding:24px;\">\n        <p style=\"color:#58a6ff;font-size:15px;font-weight:700;margin-bottom:10px;\">Agents<\u002Fp>\n        <p style=\"color:#8b949e;font-size:13px;line-height:1.65;margin-bottom:14px;\">Specialised recurring roles.<\u002Fp>\n        <ul style=\"list-style:none;display:flex;flex-direction:column;gap:6px;\">\n          <li style=\"color:#6e7681;font-size:12px;\">· reviewer<\u002Fli>\n          <li style=\"color:#6e7681;font-size:12px;\">· release helper<\u002Fli>\n          <li style=\"color:#6e7681;font-size:12px;\">· robotics pipeline assistant<\u002Fli>\n          <li style=\"color:#6e7681;font-size:12px;\">· documentation editor<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#161b22;border:1px solid #30363d;border-radius:10px;padding:24px;\">\n        <p style=\"color:#3fb950;font-size:15px;font-weight:700;margin-bottom:10px;\">Skills<\u002Fp>\n        <p style=\"color:#8b949e;font-size:13px;line-height:1.65;margin-bottom:14px;\">Domain workflow patterns, loaded on demand.<\u002Fp>\n        <ul style=\"list-style:none;display:flex;flex-direction:column;gap:6px;\">\n          <li style=\"color:#6e7681;font-size:12px;\">· PBS job submission<\u002Fli>\n          <li style=\"color:#6e7681;font-size:12px;\">· ROS bag conversion<\u002Fli>\n          <li style=\"color:#6e7681;font-size:12px;\">· dataset rendering<\u002Fli>\n          <li style=\"color:#6e7681;font-size:12px;\">· benchmark reporting<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#161b22;border:1px solid #30363d;border-radius:10px;padding:24px;\">\n        <p style=\"color:#ffa657;font-size:15px;font-weight:700;margin-bottom:10px;\">Instructions<\u002Fp>\n        <p style=\"color:#8b949e;font-size:13px;line-height:1.65;margin-bottom:14px;\">Always-on project conventions, applied per file type.<\u002Fp>\n        <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:12px;\">\n          <pre style=\"font-size:11px;color:#8b949e;line-height:1.7;\">Do not rely on memory.\nPut the convention in the repo.<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#161b22;border:1px solid #30363d;border-radius:10px;padding:24px;\">\n        <p style=\"color:#a371f7;font-size:15px;font-weight:700;margin-bottom:10px;\">Hooks + MCP + Plugins<\u002Fp>\n        <p style=\"color:#8b949e;font-size:13px;line-height:1.65;margin-bottom:14px;\">Hooks run on file events. MCP servers and plugins connect the agent to external tools, data, and services.<\u002Fp>\n        <ul style=\"list-style:none;display:flex;flex-direction:column;gap:6px;\">\n          <li style=\"color:#6e7681;font-size:12px;\">· VS Code extensions<\u002Fli>\n          <li style=\"color:#6e7681;font-size:12px;\">· GitHub integrations<\u002Fli>\n          <li style=\"color:#6e7681;font-size:12px;\">· project systems + docs<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Model portability note -->\n    <div style=\"border-left:3px solid #58a6ff;padding:20px 24px;background:#161b22;border-radius:0 10px 10px 0;margin-bottom:16px;\">\n      <p style=\"color:#58a6ff;font-size:11px;letter-spacing:2px;margin-bottom:10px;font-weight:600;\">WORKS ACROSS MODELS<\u002Fp>\n      <p style=\"color:#8b949e;font-size:13px;line-height:1.75;max-width:680px;\">These customisations are not locked to one provider. The same agent, skill, and instruction files work with <span style=\"color:#e6edf3;\">Claude<\u002Fspan>, <span style=\"color:#e6edf3;\">Copilot (Azure)<\u002Fspan>, <span style=\"color:#e6edf3;\">self-hosted models<\u002Fspan>, and any tool reachable via MCP — including VS Code extensions and GitHub integrations. The context layer is model-agnostic.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- Memory restart tip -->\n    <div style=\"border-left:3px solid #ffa657;padding:20px 24px;background:#161b22;border-radius:0 10px 10px 0;\">\n      <p style=\"color:#ffa657;font-size:11px;letter-spacing:2px;margin-bottom:10px;font-weight:600;\">ON MEMORY + RESTARTS<\u002Fp>\n      <p style=\"color:#8b949e;font-size:13px;line-height:1.75;max-width:680px;\">Holding a long conversation in memory — and re-reading it on every turn — is token-intensive. Once context is structured in files, <span style=\"color:#e6edf3;\">restarting a fresh chat is often cheaper than continuing a long one.<\u002Fspan> The model picks up exactly where it left off because the context lives in the repo, not the thread.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ [09] PRACTICAL PROMPT TEMPLATE ═══ -->\n<section id=\"template\" style=\"background:#161b22;padding:100px 48px;\">\n  <div style=\"max-width:920px;margin:0 auto;\">\n    <p style=\"color:#3fb950;font-size:11px;letter-spacing:3px;margin-bottom:20px;font-weight:600;\">[09]<\u002Fp>\n    <h2 style=\"font-size:clamp(26px,4vw,52px);font-weight:700;letter-spacing:-1.5px;margin-bottom:20px;line-height:1.15;\">Practical prompt template<\u002Fh2>\n    <p style=\"color:#8b949e;font-size:15px;max-width:560px;margin-bottom:48px;line-height:1.7;\">Review visible artifacts — not hidden reasoning. Ask for outputs you can check.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px;\">\n      <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:10px;overflow:hidden;\">\n        <div style=\"background:#21262d;padding:12px 20px;border-bottom:1px solid #30363d;\">\n          <span style=\"color:#3fb950;font-size:12px;font-weight:700;letter-spacing:1px;\">TASK + CONTEXT<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:24px;\">\n          <pre style=\"font-size:13px;color:#e6edf3;line-height:2.0;\"><span style=\"color:#8b949e;\">Task:<\u002Fspan>\n  &lt;what you want changed&gt;\n\n<span style=\"color:#8b949e;\">Context:<\u002Fspan>\n  &lt;files, paths, platform,\n   constraints&gt;<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0d1117;border:1px solid #30363d;border-radius:10px;overflow:hidden;\">\n        <div style=\"background:#21262d;padding:12px 20px;border-bottom:1px solid #30363d;\">\n          <span style=\"color:#58a6ff;font-size:12px;font-weight:700;letter-spacing:1px;\">SUCCESS + OUTPUT<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:24px;\">\n          <pre style=\"font-size:13px;color:#e6edf3;line-height:2.0;\"><span style=\"color:#8b949e;\">Success:<\u002Fspan>\n  &lt;how to verify it worked&gt;\n\n<span style=\"color:#8b949e;\">Boundaries:<\u002Fspan>\n  &lt;what not to do&gt;\n\n<span style=\"color:#8b949e;\">Output:<\u002Fspan>\n  &lt;patch / checklist / command&gt;<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Visible artifacts -->\n    <div style=\"border:1px solid #30363d;border-radius:10px;padding:32px;background:#0d1117;\">\n      <p style=\"color:#ffa657;font-size:11px;letter-spacing:3px;margin-bottom:20px;font-weight:600;\">VISIBLE ARTIFACTS TO REQUEST<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;\">\n        <div style=\"padding:12px 16px;background:#161b22;border:1px solid #30363d;border-radius:6px;font-size:12px;color:#8b949e;line-height:1.5;\">plan before edits<\u002Fdiv>\n        <div style=\"padding:12px 16px;background:#161b22;border:1px solid #30363d;border-radius:6px;font-size:12px;color:#8b949e;line-height:1.5;\">commands run<\u002Fdiv>\n        <div style=\"padding:12px 16px;background:#161b22;border:1px solid #30363d;border-radius:6px;font-size:12px;color:#8b949e;line-height:1.5;\">files changed<\u002Fdiv>\n        <div style=\"padding:12px 16px;background:#161b22;border:1px solid #30363d;border-radius:6px;font-size:12px;color:#8b949e;line-height:1.5;\">test results<\u002Fdiv>\n        <div style=\"padding:12px 16px;background:#161b22;border:1px solid #30363d;border-radius:6px;font-size:12px;color:#8b949e;line-height:1.5;\">assumptions + unknowns<\u002Fdiv>\n        <div style=\"padding:12px 16px;background:#161b22;border:1px solid #30363d;border-radius:6px;font-size:12px;color:#8b949e;line-height:1.5;\">rollback path<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ [10] TAKEAWAYS ═══ -->\n<section id=\"takeaways\" style=\"padding:100px 48px;background:#0d1117;\">\n  <div style=\"max-width:920px;margin:0 auto;\">\n    <p style=\"color:#3fb950;font-size:11px;letter-spacing:3px;margin-bottom:20px;font-weight:600;\">[10]<\u002Fp>\n    <h2 style=\"font-size:clamp(26px,4vw,52px);font-weight:700;letter-spacing:-1.5px;margin-bottom:64px;line-height:1.15;\">Key takeaways<\u002Fh2>\n\n    <div style=\"display:flex;flex-direction:column;gap:0;\">\n      <div style=\"display:grid;grid-template-columns:64px 1fr;gap:24px;align-items:baseline;padding-bottom:40px;border-bottom:1px solid #21262d;margin-bottom:40px;\">\n        <span style=\"font-size:clamp(36px,5vw,64px);font-weight:700;color:#21262d;line-height:1;letter-spacing:-2px;\">01<\u002Fspan>\n        <p style=\"font-size:clamp(17px,2vw,22px);color:#e6edf3;font-weight:600;line-height:1.4;\">Better context beats longer prompts.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:64px 1fr;gap:24px;align-items:baseline;padding-bottom:40px;border-bottom:1px solid #21262d;margin-bottom:40px;\">\n        <span style=\"font-size:clamp(36px,5vw,64px);font-weight:700;color:#21262d;line-height:1;letter-spacing:-2px;\">02<\u002Fspan>\n        <p style=\"font-size:clamp(17px,2vw,22px);color:#e6edf3;font-weight:600;line-height:1.4;\">Repositories are durable context windows.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:64px 1fr;gap:24px;align-items:baseline;padding-bottom:40px;border-bottom:1px solid #21262d;margin-bottom:40px;\">\n        <span style=\"font-size:clamp(36px,5vw,64px);font-weight:700;color:#21262d;line-height:1;letter-spacing:-2px;\">03<\u002Fspan>\n        <p style=\"font-size:clamp(17px,2vw,22px);color:#e6edf3;font-weight:600;line-height:1.4;\">Make success observable.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:64px 1fr;gap:24px;align-items:baseline;padding-bottom:40px;border-bottom:1px solid #21262d;margin-bottom:40px;\">\n        <span style=\"font-size:clamp(36px,5vw,64px);font-weight:700;color:#21262d;line-height:1;letter-spacing:-2px;\">04<\u002Fspan>\n        <p style=\"font-size:clamp(17px,2vw,22px);color:#e6edf3;font-weight:600;line-height:1.4;\">Use Ask · Plan · Act to match the task.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:64px 1fr;gap:24px;align-items:baseline;padding-bottom:64px;\">\n        <span style=\"font-size:clamp(36px,5vw,64px);font-weight:700;color:#21262d;line-height:1;letter-spacing:-2px;\">05<\u002Fspan>\n        <p style=\"font-size:clamp(17px,2vw,22px);color:#e6edf3;font-weight:600;line-height:1.4;\">Put repeated conventions into instructions, skills, and tasks.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Limitations -->\n    <div style=\"border:1px solid #30363d;border-radius:10px;overflow:hidden;margin-bottom:48px;\">\n      <div style=\"background:#21262d;padding:14px 24px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:12px;\">\n        <span style=\"color:#ff7b72;font-size:11px;letter-spacing:3px;font-weight:600;\">LIMITATIONS<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:28px 32px;background:#161b22;display:grid;grid-template-columns:1fr 1fr;gap:32px;\">\n        <div>\n          <p style=\"color:#e6edf3;font-size:14px;font-weight:600;margin-bottom:10px;\">You won't know the cost until after<\u002Fp>\n          <p style=\"color:#8b949e;font-size:13px;line-height:1.75;\">No model tells you upfront how many tokens a task will consume. Usage only becomes visible after the fact — which makes it hard to budget or compare approaches before committing.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-left:1px solid #30363d;padding-left:32px;\">\n          <p style=\"color:#e6edf3;font-size:14px;font-weight:600;margin-bottom:10px;\">GitHub Copilot AI credits — real numbers<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:4px;\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #21262d;padding-bottom:12px;\">\n              <span style=\"color:#8b949e;font-size:13px;\">Single file edit<\u002Fspan>\n              <span style=\"color:#ff7b72;font-size:18px;font-weight:700;letter-spacing:-0.5px;\">100+ credits<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;\">\n              <span style=\"color:#8b949e;font-size:13px;\">Write a PR description<\u002Fspan>\n              <span style=\"color:#ffa657;font-size:18px;font-weight:700;letter-spacing:-0.5px;\">~30 credits<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"color:#6e7681;font-size:11px;margin-top:16px;line-height:1.6;\">Costs vary by model tier and task complexity. Better context = fewer retries = fewer credits spent.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Final thought -->\n    <div style=\"background:#161b22;border:1px solid #30363d;border-radius:10px;overflow:hidden;\">\n      <div style=\"background:#21262d;padding:12px 24px;border-bottom:1px solid #30363d;\">\n        <span style=\"color:#3fb950;font-size:12px;font-weight:700;letter-spacing:1px;\">FINAL THOUGHT<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:28px;\">\n        <pre style=\"font-size:14px;color:#e6edf3;line-height:2.0;\">Prompt less like a wish.\nPrompt more like a reproducible workflow.<\u002Fpre>\n        <p style=\"color:#8b949e;font-size:13px;margin-top:20px;line-height:1.7;\">Repository-first prompting makes agents less magical and more useful.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"padding:36px 48px;border-top:1px solid #21262d;background:#0d1117;\">\n  <div style=\"max-width:920px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;\">\n    <span style=\"color:#3fb950;font-size:13px;font-weight:700;\">▍tokens<\u002Fspan>\n    <div style=\"display:flex;gap:28px;align-items:center;flex-wrap:wrap;\">\n      <span style=\"color:#8b949e;font-size:12px;\">Margaux Edwards · QUT Centre of Robotics - Mid Year Retreat· June 2026<\u002Fspan>\n      <a href=\"https://github.com\" style=\"color:#58a6ff;font-size:12px;\" style-hover=\"color:#e6edf3;\">github ↗<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
